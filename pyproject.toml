[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=7.1.0,<8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "damlisk"
requires-python = ">=3.11,<4"
dynamic = [
    "version",
    "description",
    "readme",
    "authors",
    "keywords",
    "classifiers",
    "scripts",
    "urls",
]
dependencies = ["dazl>=8.9", "click>=8.1,<9", "loguru"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | build
  | dist
  | venv
)/
'''
force-exclude = 'damlisk/version\.py'
skip-magic-trailing-comma = true

[tool.isort]
force_grid_wrap = 0
include_trailing_comma = true
known_first_party = ["damlisk"]
profile = "black"
multi_line_output = 3
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
skip = ["damlisk/version.py"]

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal --strict-markers"
python_files = "test_*.py"
testpaths = ["tests"]
xfail_strict = true

[tool.mypy]
disable_error_code = ["annotation-unchecked"]
follow_imports = "silent"
ignore_missing_imports = true
implicit_optional = true

[tool.coverage.run]
branch = true
source = ["damlisk"]
omit = ["damlisk/version.py"]
relative_files = true

[dependency-groups]
test = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-instafail>=0.4,<1.0",
    "pytest-xdist>=3.0,<3.4",
]
lint = [
    "black==26.3.1",
    "flake8==6.1.0",
    "flake8-bugbear==23.12.2",
    "flake8-use-fstring==1.4",
    "isort==5.13.2",
    "mypy==1.19",
]
dev = [{include-group = "test"}, {include-group = "lint"}, "build", "twine"]
